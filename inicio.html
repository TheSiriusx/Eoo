<!DOCTYPE html>
<html lang="es"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubii - Inicia sesión</title>
    <link rel="stylesheet" href="styles.css">
<link type="text/css" rel="stylesheet" id="dark-mode-custom-link"><link type="text/css" rel="stylesheet" id="dark-mode-general-link"><style lang="en" type="text/css" id="dark-mode-custom-style"></style><style lang="en" type="text/css" id="dark-mode-native-style"></style><style lang="en" type="text/css" id="dark-mode-native-sheet"></style></head>
<body>
    <div class="top-logo">
        <img src="LogoUbiiOnline.svg" alt="Ubii Logo" width="80">
    </div>
    <div class="container">
        <div class="login-box">
            <header>
                <div class="logo">
                    <img src="LogoUbiiOnline.svg" alt="Ubii Logo" width="100">
                </div>
                <h1>Inicia sesión</h1>
            </header>

            <div class="user-type-selector">
                <button type="button" class="type-btn active" id="btnNatural">Natural</button>
                <button type="button" class="type-btn" id="btnJuridico">Jurídico</button>
            </div>

            <form class="login-form" id="loginForm">
                <!-- Campos Jurídicos Condicionales -->
                <div id="juridicoFields" style="display: none;">
                    <div class="authorized-user-check">
                        <label for="isAuthorized">¿Eres un usuario autorizado?</label>
                        <input type="checkbox" id="isAuthorized" name="isAuthorized">
                    </div>
                    
                    <div id="rifGroup" class="input-group rif-group" style="display: none;">
                        <div class="rif-container">
                            <select name="rifType" class="rif-select">
                                <option value="V">V</option>
                                <option value="J">J</option>
                                <option value="G">G</option>
                                <option value="E">E</option>
                                <option value="P">P</option>
                            </select>
                            <input type="text" name="rifNumber" placeholder="RIF de la empresa">
                        </div>
                        <div id="rifError" class="error-message"></div>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" name="usuario" placeholder="Correo">
                    <div id="usuarioError" class="error-message"></div>
                </div>

                <!-- Campo de Contraseña -->
                <div class="input-group password-group">
                    <input type="password" name="password" id="password" placeholder="Contraseña">
                    <span class="toggle-password" data-target="password">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </span>
                    <div id="passwordError" class="error-message"></div>
                </div>

                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn-ingresar active">Ingresar</button>
            </form>

            <div class="footer-actions">
                <button type="button" class="btn-registrar">Registrarme</button>
                <p class="contact-text">¿Tienes problemas? <a href="#" id="openContactModal">Contáctanos</a></p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="modal.js"></script>
    <script src="script.js"></script>


    <div id="contactModal" class="modal">
        <div class="modal-content">
            <h2>Contáctanos</h2>
            <div class="contact-options">
                <div class="contact-item">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-11.7 8.38 8.38 0 0 1 3.8.9L21 3z"></path></svg>
                    </span>
                    <a href="" target="_blank">(0412) 231 98 03</a>
                </div>
                <div class="contact-item">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    </span>
                    <a href="mailto:atencionubii@ubiipagos.com">atencionubii@ubiipagos.com</a>
                </div>
                <div class="contact-item">
                    <span class="icon">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l2.19-2.19a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                    </span>
                    <a href="tel:02123191580">(0212) 319 15 80</a>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="closeContactModal" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>
</body></html>
